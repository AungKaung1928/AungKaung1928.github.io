<!doctype html>
<!-- Source of img/og/<page>.jpg (1200x630 link preview of one walkthrough). Parameters: ?page=<file>.html; title and text
     come from that page's og:title and og:description. Rebuild: serve the repo root, screenshot at 1200x630, save as JPEG q86. -->
<html lang="en"><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #ffffff; color: #10161e; box-sizing: border-box; padding: 72px 80px 64px; display: flex; flex-direction: column;
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'Helvetica Neue', sans-serif; }
  .eyebrow { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 22px; color: #005F73; }
  h1 { font-size: 76px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; margin: 26px 0 26px; max-width: 980px; }
  p { font-size: 30px; line-height: 1.4; color: #3f4d58; margin: 0; max-width: 1000px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 24px; color: #005F73;
          border-top: 2px solid #e6eaed; padding-top: 20px; }
</style></head><body>
  <div class="eyebrow">Walkthrough · Aung Kaung Myat</div>
  <h1 id="t"></h1>
  <p id="d"></p>
  <div class="foot"><span>aungkaung1928.github.io</span><span id="u"></span></div>
<script>
  const page = new URLSearchParams(location.search).get('page');
  fetch('../projects/' + page).then(r => r.text()).then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html'), m = (p) => doc.querySelector(`meta[property="${p}"]`).content;
    document.getElementById('t').textContent = m('og:title');
    document.getElementById('d').textContent = m('og:description');
    document.getElementById('u').textContent = '/projects/' + page;
  });
</script>
</body></html>
