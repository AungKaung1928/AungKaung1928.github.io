name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: List public repository names (link check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "users/${{ github.repository_owner }}/repos?per_page=100&type=owner" \
            --jq '.[] | select((.fork or .private) | not) | {name}' \
            | jq -s '.' > repos.json
          test "$(jq length repos.json)" -gt 0
      - name: Check the site
        run: |
          node tools/check-kb.js
          node tools/check-chat.js
          node tools/check-links.js
          node tools/check-contrast.js
          node tools/check-scroll.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
